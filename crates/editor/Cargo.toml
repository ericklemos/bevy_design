[package]
name = "editor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
dev-dynamic = ["bevy/dynamic_linking"]

[dependencies]
bevy = { workspace = true, features = ["default_app", "3d_bevy_render", "bevy_winit", "debug", "file_watcher", "multi_threaded", "wayland", "x11"] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["default_fonts", "render"] }
directories = "6"
egui_dock = "0.21"
engine_runtime.workspace = true
game.workspace = true
projects.workspace = true
redb = "5"
rfd = "0.18"
ron.workspace = true
tempfile = "3"
